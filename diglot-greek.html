<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Diglot Reader — Life OS</title>
<link rel="stylesheet" href="css/main.css?v=2" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Theano+Didot&display=swap" rel="stylesheet">
<style>
  :root {
    --reader-accent: #0369a1;
    --reader-accent-bg: #f0f9ff;
    --reader-accent-border: #bae6fd;
    --english-color: #6b7280;
    --vnum-color: #9ca3af;
    --reader-bg: #fafaf9;
    --reader-text: #1c1917;
    --reader-muted: #a8a29e;
    --reader-hr: #e7e5e4;
    --popup-bg: #1c1917;
    --popup-text: #fafaf9;
  }

  /* ── Controls bar ── */
  #controls {
    position: sticky; top: 0; z-index: 100;
    background: var(--white, #fff); border-bottom: 1px solid var(--reader-hr);
    padding: 10px 16px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 8px 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  #controls label { color: #57534e; white-space: nowrap; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }

  /* Per-case selector layout */
  .case-controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .case-ctrl { display: flex; align-items: center; gap: 5px; }
  .case-tag {
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    white-space: nowrap;
  }
  .case-tag.G { background: #fef3c7; color: #92400e; }
  .case-tag.A { background: #fee2e2; color: #991b1b; }
  .case-tag.N { background: #dbeafe; color: #1d4ed8; }
  .case-tag.D { background: #d1fae5; color: #065f46; }
  .case-tag.conj { background: #ffedd5; color: #c2410c; }
  .case-tag.prep { background: #ccfbf1; color: #0f766e; }

  /* Tier panel visibility */
  .tier-panel { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tier-panel.active { display: flex; }

  /* Toggle groups */
  [data-case="G"] button.active { background: #d97706; color: white; border-color: #d97706; }
  [data-case="A"] button.active { background: #dc2626; color: white; border-color: #dc2626; }
  [data-case="N"] button.active { background: #2563eb; color: white; border-color: #2563eb; }
  [data-case="D"] button.active { background: #059669; color: white; border-color: #059669; }
  [data-case] button[data-val="0"].active { background: #6b7280; color: white; border-color: #6b7280; }
  .toggle-group {
    display: inline-flex; border: 1px solid var(--reader-accent-border);
    border-radius: 6px; overflow: hidden; background: white;
  }
  .toggle-group button {
    border: none; padding: 5px 10px; background: white;
    color: #57534e; cursor: pointer; font-family: inherit; font-size: 12px;
    border-right: 1px solid var(--reader-accent-border);
  }
  .toggle-group button:last-child { border-right: none; }
  .toggle-group button.active { background: var(--reader-accent); color: white; }
  .checkbox-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

  /* Color key */
  #colorKey {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
    font-size: 12px; color: #57534e; min-height: 18px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ── Reader text area ── */
  #reader-body {
    max-width: 720px; margin: 0 auto; padding: 24px 20px 80px;
    font-family: 'Theano Didot', Georgia, serif;
    color: var(--reader-text); background: var(--reader-bg);
    line-height: 1.85;
  }
  #reader-body h1 {
    font-size: 1.6rem; font-weight: 700; color: #44403c; margin-bottom: 4px;
    font-family: 'Theano Didot', Georgia, serif;
  }
  #reader-body p.subtitle {
    font-style: italic; font-size: .9rem; color: var(--reader-muted); margin-bottom: 20px;
  }
  #reader-body hr { border: none; border-top: 1px solid var(--reader-hr); margin: 14px 0; }

  .verse-block { margin-bottom: 20px; }
  p.verse { font-size: 1.08rem; line-height: 2.4; }
  p.greek-line {
    font-size: .95rem; color: #78716c; margin-top: 4px; padding-left: 4px;
    line-height: 1.6;
  }
  .vnum {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: .72rem; font-weight: 600; color: var(--vnum-color);
    vertical-align: super; margin-right: 4px; user-select: none;
  }

  /* Tokens */
  .tok {
    transition: background .12s, color .12s;
    border-radius: 3px; cursor: pointer; padding: 0 1px;
    display: inline-block; vertical-align: middle;
  }
  .tok:hover { background: rgba(124,58,237,.12); }
  .tok.english { color: var(--english-color); }

  /* Stacked tokens */
  .tok.stacked {
    display: inline-flex; flex-direction: column;
    align-items: center; line-height: 1.05;
    vertical-align: middle; padding: 2px 5px; border-radius: 4px;
  }
  .tok.stacked:hover { filter: brightness(0.96); }

  /* Case/category colors — text only */
  .tok.case-N { color: #2563eb; }
  .tok.case-G { color: #d97706; }
  .tok.case-D { color: #059669; }
  .tok.case-A { color: #dc2626; }
  .tok.case-V { color: #7c3aed; }
  .tok.cat-conj { color: #ea580c; }
  .tok.cat-prep { color: #0d9488; }
  .tok.cased-flat { display: inline-block; padding: 0 2px; vertical-align: middle; }

  .tok .form-en { font-size: .82rem; color: inherit; font-style: italic; font-family: inherit; }
  .tok .form-tr { font-size: .82rem; color: inherit; font-style: italic; font-family: 'Theano Didot', Georgia, serif; }
  .tok .form-gr { font-size: 1.05rem; color: inherit; font-family: 'Theano Didot', Georgia, serif; }
  .tok.stacked .form-en + .form-tr,
  .tok.stacked .form-tr + .form-gr {
    border-top: 1px dashed #e7e5e4; margin-top: 1px; padding-top: 1px;
  }

  .greek-line .tok { font-style: normal; color: #78716c; cursor: pointer; }
  .greek-line .tok:hover { background: rgba(3,105,161,.12); color: var(--reader-accent); }

  /* Popup */
  #popup {
    position: fixed; background: var(--popup-bg); color: var(--popup-text);
    padding: 14px 16px; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-width: 360px; z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; line-height: 1.5; display: none;
  }
  #popup.show { display: block; }
  #popup .pop-surface { font-family: 'Theano Didot', Georgia, serif; font-size: 22px; line-height: 1.2; margin-bottom: 2px; }
  #popup .pop-translit { color: #7dd3fc; font-style: italic; margin-bottom: 10px; }
  #popup .pop-row { display: flex; gap: 6px; margin-bottom: 4px; }
  #popup .pop-label { color: #7dd3fc; font-weight: 600; min-width: 64px; flex-shrink: 0; }
  #popup .lemma-greek { font-family: 'Theano Didot', Georgia, serif; font-size: 16px; }
  #popup .gloss { color: #fde68a; }
  #popup .pop-close {
    position: absolute; top: 6px; right: 8px;
    background: none; border: none; color: #7dd3fc;
    font-size: 18px; cursor: pointer;
  }
  #popup .strongs { color: #94a3b8; font-size: 11px; margin-top: 6px; }
  #popup .freq { color: #94a3b8; font-size: 11px; }

  @media (max-width: 600px) {
    #controls { padding: 8px 12px; gap: 7px 10px; }
    #reader-body { padding: 20px 16px 80px; }
  }
</style>
</head>
<body>

<!-- LifeOS-style back header -->
<header class="page-header" style="margin-bottom:0;">
  <div class="header-row">
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="apps.html" style="font-size:22px;text-decoration:none;color:var(--gray-400,#9ca3af);line-height:1;">&#8592;</a>
      <div>
        <h1 style="font-size:1.2rem;margin:0;">Greek Diglot Reader</h1>
        <div class="subtitle" style="font-size:12px;">Mark 1:1–10 · SBLGNT (MorphGNT)</div>
      </div>
    </div>
  </div>
</header>

<!-- Sticky controls bar -->
<div id="controls">
  <!-- Chapter selector -->
  <div class="ctrl-row">
    <label>Chapter:</label>
    <select id="chapterSelect" style="
      padding:5px 10px; border:1px solid #bae6fd; border-radius:6px;
      font-size:12px; font-family:inherit; background:white;
      color:#57534e; cursor:pointer;">
      <option value="0">All</option>
    </select>
  </div>
  <!-- Tier selector -->
  <div class="ctrl-row">
    <label>Tier:</label>
    <div class="toggle-group" id="tierToggle">
      <button data-val="1" class="active">1 · Articles</button>
      <button data-val="2">2 · Conjunctions</button>
      <button data-val="3">3 · Prepositions</button>
    </div>
  </div>
  <!-- Tier 1: article case controls -->
  <div class="ctrl-row tier-panel active" data-tier="1">
    <label>By case:</label>
    <div class="case-controls">
      <div class="case-ctrl">
        <span class="case-tag G">Gen</span>
        <div class="toggle-group" data-case="G">
          <button data-val="0" class="active">Off</button>
          <button data-val="1">1</button>
          <button data-val="2">2</button>
          <button data-val="3">3</button>
        </div>
      </div>
      <div class="case-ctrl">
        <span class="case-tag A">Acc</span>
        <div class="toggle-group" data-case="A">
          <button data-val="0" class="active">Off</button>
          <button data-val="1">1</button>
          <button data-val="2">2</button>
          <button data-val="3">3</button>
        </div>
      </div>
      <div class="case-ctrl">
        <span class="case-tag N">Nom</span>
        <div class="toggle-group" data-case="N">
          <button data-val="0" class="active">Off</button>
          <button data-val="1">1</button>
          <button data-val="2">2</button>
          <button data-val="3">3</button>
        </div>
      </div>
      <div class="case-ctrl">
        <span class="case-tag D">Dat</span>
        <div class="toggle-group" data-case="D">
          <button data-val="0" class="active">Off</button>
          <button data-val="1">1</button>
          <button data-val="2">2</button>
          <button data-val="3">3</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Tier 2: conjunction control -->
  <div class="ctrl-row tier-panel" data-tier="2">
    <span class="case-tag conj" style="margin-right:2px;">Conj</span>
    <div class="toggle-group" id="conjToggle">
      <button data-val="0" class="active">Off</button>
      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
    </div>
    <span style="font-size:12px;color:#9ca3af;">καί, δέ, ὅτι, ἀλλά …</span>
  </div>
  <!-- Tier 3: preposition control -->
  <div class="ctrl-row tier-panel" data-tier="3">
    <span class="case-tag prep" style="margin-right:2px;">Prep</span>
    <div class="toggle-group" id="prepToggle">
      <button data-val="0" class="active">Off</button>
      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
    </div>
    <span style="font-size:12px;color:#9ca3af;">ἐν, εἰς, ἐκ, ἀπό, πρό …</span>
  </div>
  <!-- Color key — populated dynamically -->
  <div id="colorKey" class="ctrl-row"></div>
  <!-- Secondary controls -->
  <div class="ctrl-row">
    <label>Script:</label>
    <div class="toggle-group" id="displayToggle">
      <button data-val="polytonic" class="active">Polytonic</button>
      <button data-val="monotonic">Monotonic</button>
    </div>
    <label class="checkbox-toggle" style="margin-left:4px;">
      <input type="checkbox" id="greekLineCheck" checked>
      Greek line
    </label>
    <label class="checkbox-toggle" style="margin-left:4px;">
      <input type="checkbox" id="colorToggle" checked>
      Colors
    </label>
    <button id="saveDefaultsBtn" onclick="saveDefaults()" style="
      margin-left:8px; padding:5px 11px; border-radius:6px; border:1px solid #d1d5db;
      background:white; color:#57534e; font-size:12px; cursor:pointer;
      font-family:inherit; transition:background .15s;">
      Save as default
    </button>
  </div>
</div>

<!-- Reader content -->
<div id="reader-body">
  <div id="content"></div>
</div>

<!-- Popup -->
<div id="popup">
  <button class="pop-close">×</button>
  <div class="pop-surface" id="popSurface"></div>
  <div class="pop-translit" id="popTranslit"></div>
  <div class="pop-row"><span class="pop-label">Lemma:</span><span class="lemma-greek" id="popLemma"></span> <span style="color:#7dd3fc">·</span> <span style="color:#7dd3fc;font-style:italic" id="popLemmaTr"></span></div>
  <div class="pop-row"><span class="pop-label">Form:</span><span id="popMorph"></span></div>
  <div class="pop-row"><span class="pop-label">Meaning:</span><span class="gloss" id="popGloss"></span></div>
  <div class="pop-row"><span class="pop-label">In English:</span><span id="popEn" style="color:#fbbf24;"></span></div>
  <div class="freq" id="popFreq"></div>
  <div class="strongs" id="popStrongs"></div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LEMMAS = DATA.lemmas;
const VERSES = DATA.verses;

const state = {
  tier: 1,
  articleCases: { G: 0, A: 0, N: 0, D: 0 },
  conjStage: 0,
  prepStage: 0,
  colorOn: true,
  display: 'polytonic',
  showGreekLine: true,
  chapter: 0,   // 0 = all chapters
};

function toMonotonic(s) {
  const nfd = s.normalize('NFD');
  let out = '';
  for (const ch of nfd) {
    const code = ch.charCodeAt(0);
    if (code >= 0x0300 && code <= 0x036F) {
      if (code === 0x0301) out += ch;
    } else { out += ch; }
  }
  return out.normalize('NFC');
}
function stripGreekPunct(s) {
  // Strip modern editorial punctuation — original Koine had none (scriptio continua)
  // Removes: period, comma, middle dot (ano teleia), elision apostrophe, Greek semicolon (;)
  return s.replace(/[.,·’;;:]/g, '');
}
function greekText(tok) {
  const g = state.display === 'monotonic' ? toMonotonic(tok.g) : tok.g;
  return stripGreekPunct(g);
}
function enText(tok) {
  // Strip trailing punctuation from English renderings (hyphens are meaningful — keep them)
  return tok.en.replace(/[.,;:]+/g, '');
}

function getTokenStage(tok) {
  const pos = tok.p;
  if (pos === 'RA') return state.articleCases[caseLetter(tok)] || 0;
  if (pos === 'C-') return state.conjStage;
  if (pos === 'P-') return state.prepStage;
  return 0;
}

function caseLetter(tok) {
  return ((tok.m || '') + '--------').slice(0, 8)[4] || '-';
}

function renderToken(span, tok) {
  ['stacked','english','cased-flat',
   'case-N','case-G','case-D','case-A','case-V',
   'cat-conj','cat-prep'].forEach(c => span.classList.remove(c));
  span.innerHTML = '';
  const pos = tok.p;
  const c = caseLetter(tok);
  const stage = getTokenStage(tok);
  const isCaseBearing = pos !== 'RA' && pos !== 'C-' && pos !== 'P-'
                        && (c === 'N'||c === 'G'||c === 'D'||c === 'A'||c === 'V');
  const caseArticleActive = (state.articleCases[c] || 0) > 0;
  const showPassiveTint = isCaseBearing && caseArticleActive && state.colorOn;
  if (stage === 0) {
    if (showPassiveTint) {
      span.classList.add('cased-flat', 'case-' + c);
      span.textContent = enText(tok);
    } else {
      span.classList.add('english');
      span.textContent = enText(tok);
    }
    return;
  }
  if (state.colorOn) {
    if (pos === 'RA')      span.classList.add('case-' + c);
    else if (pos === 'C-') span.classList.add('cat-conj');
    else if (pos === 'P-') span.classList.add('cat-prep');
  }
  const make = (cls, text) => {
    const e = document.createElement('span');
    e.className = cls; e.textContent = text; return e;
  };
  if (stage === 1) {
    span.classList.add('stacked');
    span.appendChild(make('form-en', enText(tok)));
    span.appendChild(make('form-tr', tok.tr));
  } else if (stage === 2) {
    span.classList.add('stacked');
    span.appendChild(make('form-tr', tok.tr));
    span.appendChild(make('form-gr', greekText(tok)));
  } else {
    span.classList.add('cased-flat');
    span.textContent = greekText(tok);
  }
}

const content = document.getElementById('content');

function buildToken(tok, vRef, idx) {
  const span = document.createElement('span');
  span.className = 'tok';
  span.dataset.v = vRef;
  span.dataset.i = idx;
  return span;
}

function buildVerse(v) {
  const block = document.createElement('div');
  block.className = 'verse-block';
  block.dataset.ref = v.ref;
  const p = document.createElement('p');
  p.className = 'verse';
  const vn = document.createElement('span');
  vn.className = 'vnum';
  vn.textContent = v.v;
  p.appendChild(vn);
  p.appendChild(document.createTextNode(' '));
  v.tokens.forEach((tok, idx) => {
    const span = buildToken(tok, v.ref, idx);
    p.appendChild(span);
    if (idx < v.tokens.length - 1) p.appendChild(document.createTextNode(' '));
  });
  block.appendChild(p);
  const gp = document.createElement('p');
  gp.className = 'greek-line';
  v.tokens.forEach((tok, idx) => {
    const span = document.createElement('span');
    span.className = 'tok';
    span.dataset.v = v.ref;
    span.dataset.i = idx;
    span.dataset.line = 'greek';
    gp.appendChild(span);
    if (idx < v.tokens.length - 1) gp.appendChild(document.createTextNode(' '));
  });
  block.appendChild(gp);
  return block;
}

function renderAll() {
  content.innerHTML = '';
  for (const v of VERSES) content.appendChild(buildVerse(v));
  applyState();
}

const KEY_ENTRIES = [
  { test: () => state.articleCases.N > 0, color: '#2563eb', label: 'Nominative', desc: 'subject' },
  { test: () => state.articleCases.G > 0, color: '#d97706', label: 'Genitive', desc: 'possession / "of"' },
  { test: () => state.articleCases.D > 0, color: '#059669', label: 'Dative', desc: 'indirect object' },
  { test: () => state.articleCases.A > 0, color: '#dc2626', label: 'Accusative', desc: 'direct object' },
  { test: () => state.conjStage > 0,      color: '#ea580c', label: 'Conjunction', desc: 'connects clauses' },
  { test: () => state.prepStage > 0,      color: '#0d9488', label: 'Preposition', desc: 'location / direction' },
];

function updateColorKey() {
  const el = document.getElementById('colorKey');
  if (!state.colorOn) { el.innerHTML = ''; return; }
  const active = KEY_ENTRIES.filter(e => e.test());
  if (!active.length) { el.innerHTML = ''; return; }
  el.innerHTML = active.map((e, i) =>
    (i > 0 ? '<span style="color:#d1d5db;">·</span>' : '') +
    `<span style="color:${e.color};font-weight:600;">${e.label}</span>` +
    `<span style="color:#9ca3af;"> ${e.desc}</span>`
  ).join('');
}

function applyState() {
  document.querySelectorAll('.tier-panel').forEach(panel => {
    panel.classList.toggle('active', parseInt(panel.dataset.tier) === state.tier);
  });
  updateColorKey();
  const blocks = content.querySelectorAll('.verse-block');
  blocks.forEach(block => {
    const verse = VERSES.find(v => v.ref === block.dataset.ref);
    // Chapter filter
    const blockChapter = parseInt(block.dataset.ref.split('.')[0]);
    if (state.chapter !== 0 && blockChapter !== state.chapter) {
      block.style.display = 'none';
      return;
    }
    block.style.display = '';
    const greekLine = block.querySelector('.greek-line');
    greekLine.style.display = state.showGreekLine ? '' : 'none';
    block.querySelectorAll('.tok').forEach(span => {
      const tok = verse.tokens[parseInt(span.dataset.i)];
      if (span.dataset.line === 'greek') {
        span.textContent = greekText(tok);
        return;
      }
      renderToken(span, tok);
    });
  });
}

// Tier selector

// Popup
const popup = document.getElementById('popup');
const PERSON = {'1':'1st','2':'2nd','3':'3rd'};
const TENSE = {'P':'present','I':'imperfect','F':'future','A':'aorist','X':'perfect','Y':'pluperfect'};
const VOICE = {'A':'active','M':'middle','P':'passive','E':'middle/passive','D':'middle/passive deponent','O':'middle/passive','N':'middle/passive','Q':'impersonal','X':'no voice'};
const MOOD = {'I':'indicative','S':'subjunctive','O':'optative','M':'imperative','N':'infinitive','P':'participle'};
const CASE = {'N':'nom.','G':'gen.','D':'dat.','A':'acc.','V':'voc.'};
const NUMBER = {'S':'sg.','P':'pl.','D':'du.'};
const GENDER = {'M':'masc.','F':'fem.','N':'neut.'};
const POS = {'A-':'adjective','C-':'conjunction','D-':'adverb','I-':'interjection','N-':'noun','P-':'preposition','RA':'article','RD':'demonstrative','RI':'interrogative pron.','RP':'personal pron.','RR':'relative pron.','V-':'verb','X-':'particle'};

function morphEnglish(pos, code) {
  const c = (code + '--------').slice(0,8);
  const [p,t,v,m,ca,n,g,d] = c.split('');
  const posLabel = POS[pos] || pos;
  const parts = [];
  if (pos === 'V-') {
    if (TENSE[t]) parts.push(TENSE[t]);
    if (VOICE[v]) parts.push(VOICE[v]);
    if (MOOD[m]) parts.push(MOOD[m]);
    if (PERSON[p]) parts.push(PERSON[p] + ' person');
    if (NUMBER[n]) parts.push(NUMBER[n]);
    if (GENDER[g]) parts.push(GENDER[g]);
    if (CASE[ca]) parts.push(CASE[ca]);
  } else {
    if (CASE[ca]) parts.push(CASE[ca]);
    if (NUMBER[n]) parts.push(NUMBER[n]);
    if (GENDER[g]) parts.push(GENDER[g]);
  }
  return posLabel + (parts.length ? ', ' + parts.join(' ') : '');
}

content.addEventListener('click', e => {
  const tgt = e.target.closest('.tok');
  if (!tgt) return;
  const verse = VERSES.find(v => v.ref === tgt.dataset.v);
  const tok = verse.tokens[parseInt(tgt.dataset.i)];
  const lem = LEMMAS[tok.l];
  document.getElementById('popSurface').textContent = tok.g;
  document.getElementById('popTranslit').textContent = tok.tr;
  document.getElementById('popLemma').textContent = tok.l;
  document.getElementById('popLemmaTr').textContent = lem.tr;
  document.getElementById('popMorph').textContent = morphEnglish(tok.p, tok.m);
  document.getElementById('popGloss').textContent = lem.gloss || '(no gloss)';
  document.getElementById('popEn').textContent = tok.en;
  document.getElementById('popFreq').textContent = lem.rank > 0
    ? `Frequency: rank ${lem.rank} in NT, occurs ${lem.count} times`
    : 'Not in frequency list';
  document.getElementById('popStrongs').textContent = lem.strongs ? `Strong's: ${lem.strongs}` : '';
  const rect = e.target.getBoundingClientRect();
  const px = Math.min(window.innerWidth - 380, rect.left);
  const py = rect.bottom + 6;
  popup.style.left = Math.max(10, px) + 'px';
  popup.style.top = (py + 240 > window.innerHeight ? rect.top - 240 : py) + 'px';
  popup.classList.add('show');
});
popup.querySelector('.pop-close').addEventListener('click', () => popup.classList.remove('show'));
document.addEventListener('click', e => {
  if (!popup.contains(e.target) && !e.target.classList.contains('tok')) {
    popup.classList.remove('show');
  }
});

// ── Persist settings to localStorage ────────────────────────────────────────
const STORAGE_KEY = 'diglot-greek-defaults';

function loadDefaults() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved) return;
    // Merge saved values into state
    if (typeof saved.tier === 'number') state.tier = saved.tier;
    if (saved.articleCases) Object.assign(state.articleCases, saved.articleCases);
    if (typeof saved.conjStage === 'number') state.conjStage = saved.conjStage;
    if (typeof saved.prepStage === 'number') state.prepStage = saved.prepStage;
    if (typeof saved.colorOn === 'boolean') state.colorOn = saved.colorOn;
    if (saved.display) state.display = saved.display;
    if (typeof saved.showGreekLine === 'boolean') state.showGreekLine = saved.showGreekLine;
    if (typeof saved.chapter === 'number') state.chapter = saved.chapter;
  } catch(e) {}
}

function saveDefaults() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const btn = document.getElementById('saveDefaultsBtn');
  btn.textContent = '✓ Saved';
  btn.style.background = '#f0fdf4';
  btn.style.borderColor = '#86efac';
  btn.style.color = '#166534';
  setTimeout(() => {
    btn.textContent = 'Save as default';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  }, 1800);
}

function syncControlsToState() {
  // Tier toggle
  document.getElementById('tierToggle').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.val) === state.tier);
  });
  // Per-case article toggles
  document.querySelectorAll('.toggle-group[data-case]').forEach(group => {
    const val = state.articleCases[group.dataset.case] || 0;
    group.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.val) === val);
    });
  });
  // Conj toggle
  document.getElementById('conjToggle').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.val) === state.conjStage);
  });
  // Prep toggle
  document.getElementById('prepToggle').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.val) === state.prepStage);
  });
  // Script toggle
  document.getElementById('displayToggle').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.val === state.display);
  });
  // Checkboxes
  document.getElementById('greekLineCheck').checked = state.showGreekLine;
  document.getElementById('colorToggle').checked = state.colorOn;
  // Chapter selector
  document.getElementById('chapterSelect').value = state.chapter;
}

// Populate chapter dropdown from verse data
(function() {
  const sel = document.getElementById('chapterSelect');
  const chapters = [...new Set(VERSES.map(v => parseInt(v.ref.split('.')[0])))].sort((a,b)=>a-b);
  chapters.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch;
    opt.textContent = 'Chapter ' + ch;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    state.chapter = parseInt(sel.value);
    applyState();
    // Scroll to top of content when switching chapters
    document.getElementById('reader-body').scrollIntoView({behavior:'smooth', block:'start'});
  });
})();

// Load saved defaults, sync controls, then render
loadDefaults();
syncControlsToState();
renderAll();
